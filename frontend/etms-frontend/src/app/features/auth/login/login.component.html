<div class="login-page">

  <!-- Left panel – decorative -->
  <div class="login-hero">
    <div class="hero-content">
      <div class="hero-logo">
        <span>ET</span>
      </div>
      <h1>Employee Task<br>Management System</h1>
      <p>Streamline your workforce. Track tasks, manage attendance, and monitor performance — all in one place.</p>

      <div class="hero-features">
        <div class="feature-item">
          <span class="feature-icon">✦</span>
          <span>Real-time task tracking</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">◷</span>
          <span>Attendance & leave management</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">◆</span>
          <span>Performance analytics</span>
        </div>
      </div>

      <div class="hero-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Right panel – form -->
  <div class="login-form-panel">
    <div class="form-container">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn" [class.active]="mode === 'login'"
                (click)="switchMode('login')">Sign In</button>
        <button class="tab-btn" [class.active]="mode === 'register'"
                (click)="switchMode('register')">Create Account</button>
      </div>

      <!-- Error -->
      <div class="error-banner" *ngIf="error()">
        <span>⚠</span> {{ error() }}
      </div>

      <!-- Login Form -->
      <form *ngIf="mode === 'login'" (ngSubmit)="onLogin()" #loginFormRef="ngForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" class="form-control" placeholder="you@company.com"
                   [(ngModel)]="loginForm.email" name="email" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input [type]="showPass() ? 'text' : 'password'" class="form-control"
                   placeholder="Enter your password"
                   [(ngModel)]="loginForm.password" name="password" required autocomplete="current-password" />
            <button type="button" class="toggle-pass" (click)="togglePassword()">
              {{ showPass() ? '🙈' : '👁' }}
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg submit-btn" [disabled]="loading()">
          <span class="spinner" *ngIf="loading()"></span>
          <span *ngIf="!loading()">Sign In</span>
        </button>
      </form>

      <!-- Register Form -->
      <form *ngIf="mode === 'register'" (ngSubmit)="onRegister()">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" placeholder="John"
                   [(ngModel)]="registerForm.firstName" name="firstName" required />
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" placeholder="Doe"
                   [(ngModel)]="registerForm.lastName" name="lastName" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="you@company.com"
                 [(ngModel)]="registerForm.email" name="email" required />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Create a strong password"
                 [(ngModel)]="registerForm.password" name="password" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Role</label>
            <select class="form-control" [(ngModel)]="registerForm.roleId" name="roleId">
              <option *ngFor="let r of roles" [value]="r.id">{{ r.name }}</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Department</label>
            <select class="form-control" [(ngModel)]="registerForm.departmentId" name="departmentId">
              <option *ngFor="let d of departments" [value]="d.id">{{ d.name }}</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg submit-btn" [disabled]="loading()">
          <span class="spinner" *ngIf="loading()"></span>
          <span *ngIf="!loading()">Create Account</span>
        </button>
      </form>

    </div>
  </div>

</div>
