<aside class="sidebar" [class.collapsed]="collapsed()">

  <!-- Logo / Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <span>ET</span>
    </div>
    <div class="brand-text" *ngIf="!collapsed()">
      <span class="brand-name">ETMS</span>
      <span class="brand-tagline">Task Management</span>
    </div>
    <button class="collapse-btn" (click)="toggle()" [title]="collapsed() ? 'Expand' : 'Collapse'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path *ngIf="!collapsed()" d="m15 18-6-6 6-6"/>
        <path *ngIf="collapsed()"  d="m9 18 6-6-6-6"/>
      </svg>
    </button>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">
    <div class="nav-section-label" *ngIf="!collapsed()">MENU</div>

    <a *ngFor="let item of visibleItems()"
       [routerLink]="item.route"
       routerLinkActive="active"
       class="nav-item"
       [title]="collapsed() ? item.label : ''">
      <span class="nav-icon">{{ item.icon }}</span>
      <span class="nav-label" *ngIf="!collapsed()">{{ item.label }}</span>
      <span class="nav-badge" *ngIf="item.badge && !collapsed()">{{ item.badge }}</span>
    </a>
  </nav>

  <!-- User section -->
  <div class="sidebar-footer">
    <div class="user-card" [class.compact]="collapsed()">
      <div class="avatar avatar-md {{ avatarColor }}">{{ initials }}</div>
      <div class="user-info" *ngIf="!collapsed()">
        <span class="user-email">{{ email }}</span>
        <span class="user-role-badge">{{ role }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="auth.logout()" [title]="collapsed() ? 'Logout' : ''">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span *ngIf="!collapsed()">Logout</span>
    </button>
  </div>

</aside>
